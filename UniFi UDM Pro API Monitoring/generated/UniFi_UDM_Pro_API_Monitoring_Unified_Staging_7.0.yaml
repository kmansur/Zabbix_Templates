zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 9a7b1f8ac78a4c27aa0aa540c6485078
    name: Templates/Network devices
  templates:
  - uuid: d93fac0065495aa8aac84887d514c6b1
    template: UniFi UDM Pro API Monitoring Unified RC
    name: UniFi UDM Pro API Monitoring Unified RC
    description: 'UniFi UDM Pro API Monitoring 0.8.0-rc5. Unified collector/template release candidate. Adds dashboard telemetry,
      rolling 1h/1d/1w/30d traffic windows, current client RSSI, DPI application ranking and Wi-Fi connectivity while retaining
      the existing 0.7 API contracts. STAGING COPY: use only on a cloned host for release-candidate validation.'
    vendor:
      name: Net Tech
      version: 0.8-0-rc5
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 8eed88fe31c65c3da907a5685a5ff495
      name: UniFi API info raw
      type: EXTERNAL
      key: unifi_udm_pro_api_unified.py["info","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.TLS.ARG}"]
      delay: 1h
      history: 7d
      value_type: TEXT
      trends: '0'
      timeout: 30s
      tags:
      - tag: component
        value: api
    - uuid: 7a31371dfbdf517bbbd552934fa03b7f
      name: UniFi Integration API collection available
      type: DEPENDENT
      key: unifi.collector.integration.available
      delay: '0'
      history: 90d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'try { var data = JSON.parse(value); return data.error ? 0 : 1; } catch (e) { return 0; }'
      master_item:
        key: unifi_udm_pro_api_unified.py["info","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.TLS.ARG}"]
      tags:
      - tag: component
        value: collector
      triggers:
      - uuid: d75280a1eec759e98ddf878e26d3bb7d
        expression: max(/UniFi UDM Pro API Monitoring Unified RC/unifi.collector.integration.available,10m)=0
        name: UniFi Integration API collection is failing
        priority: HIGH
        description: The Integration API master item is returning an error or invalid JSON.
    - uuid: c00ddb31ebde53fa86d616988e5f3de3
      name: UniFi Integration API last error
      type: DEPENDENT
      key: unifi.collector.integration.error
      delay: '0'
      history: 30d
      value_type: TEXT
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'try { var data = JSON.parse(value); if (!data.error) { return ""; } return data.error + (data.details ? ": " +
          data.details : ""); } catch (e) { return "invalid JSON: " + e.message; }'
      master_item:
        key: unifi_udm_pro_api_unified.py["info","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.TLS.ARG}"]
      tags:
      - tag: component
        value: collector
    - uuid: 81564528aff956408cb1a85600ea98d9
      name: UniFi Network application version
      type: DEPENDENT
      key: unifi.api.application_version
      delay: '0'
      history: 90d

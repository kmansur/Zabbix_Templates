zabbix_export:
  version: '8.0'
  template_groups:
  - uuid: 9a7b1f8ac78a4c27aa0aa540c6485078
    name: Templates/Network devices
  templates:
  - uuid: 60907501f8e05019893ae74d597dfb09
    template: UniFi UDM Pro API Monitoring Unified RC
    name: UniFi UDM Pro API Monitoring Unified RC
    description: 'UniFi UDM Pro API Monitoring 0.8.0-rc5. Unified collector/template release candidate. Adds dashboard telemetry,
      rolling 1h/1d/1w/30d traffic windows, current client RSSI, DPI application ranking and Wi-Fi connectivity while retaining
      the existing 0.7 API contracts. STAGING COPY: use only on a cloned host for release-candidate validation.'
    vendor:
      name: Net Tech
      version: 0.8-0-rc5
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 488d878eae95582dbb924979093b67a1
      name: UniFi Network application version
      type: DEPENDENT
      key: unifi.api.application_version
      history: 90d
      value_type: CHAR
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.applicationVersion
      master_item:
        key: unifi_udm_pro_api_unified.py["info","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.TLS.ARG}"]
      tags:
      - tag: component
        value: api
      triggers:
      - uuid: 6bc5ca925be3510f946ea028612c7537
        expression: last(/UniFi UDM Pro API Monitoring Unified RC/unifi.api.application_version,#1)<>last(/UniFi UDM Pro API
          Monitoring Unified RC/unifi.api.application_version,#2)
        name: UniFi Network application version changed
        opdata: 'Current version: {ITEM.LASTVALUE1}'
        priority: INFO
        manual_close: 'YES'
    - uuid: 64d7ac49f6715339b72b73805db35ebf
      name: UniFi clients total
      type: DEPENDENT
      key: unifi.clients.total
      history: 90d
      preprocessing:

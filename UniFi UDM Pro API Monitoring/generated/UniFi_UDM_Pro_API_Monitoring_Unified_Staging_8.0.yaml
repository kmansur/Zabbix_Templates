    discovery_rules:
    - uuid: af158ef4719d5038bcecec99aa7c7b2e
      name: UniFi official gateway statistics discovery
      type: EXTERNAL
      key: unifi_udm_pro_api_unified.py["discover-devices","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.SITE.ID}","{$UNIFI.TLS.ARG}"]
      delay: 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#UNIFI.DEVICE.MODEL}'
          value: '{$UNIFI.LLD.OFFICIAL.STATS.MODEL.MATCHES}'
      lifetime: 30d
      description: Discovers gateway-class devices for parallel monitoring through the documented Integration API statistics/latest
        endpoint.
      item_prototypes:
      - uuid: 9ba6f8e1b00a5bf9a9a9c8cfcd519b1a
        name: Official API statistics raw on {#UNIFI.DEVICE.NAME}
        type: EXTERNAL
        key: unifi_udm_pro_api_unified.py["device-stats","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.SITE.ID}","{#UNIFI.DEVICE.ID}","{$UNIFI.TLS.ARG}"]
        delay: 2m
        history: 7d
        value_type: TEXT
        description: Raw snapshot from the documented /devices/{deviceId}/statistics/latest Integration API endpoint.
        timeout: 30s
        tags:
        - tag: component
          value: official-api
        - tag: device
          value: '{#UNIFI.DEVICE.NAME}'
      - uuid: e10f5b1bd5c4537aad7ae9289bbfd8b7
        name: Official API statistics available on {#UNIFI.DEVICE.NAME}
        type: DEPENDENT
        key: unifi.official.stats.available[{#UNIFI.DEVICE.ID}]
        history: 90d
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'try { var data = JSON.parse(value); return data.error ? 0 : 1; } catch (e) { return 0; }'
        master_item:
          key: unifi_udm_pro_api_unified.py["device-stats","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.SITE.ID}","{#UNIFI.DEVICE.ID}","{$UNIFI.TLS.ARG}"]
        tags:
        - tag: component
          value: collector
        - tag: source
          value: official-api
        trigger_prototypes:
        - uuid: b644666d470a546fa1473b7f454562b7
          expression: max(/UniFi UDM Pro API Monitoring Unified RC/unifi.official.stats.available[{#UNIFI.DEVICE.ID}],10m)=0
          name: Official UniFi statistics collection is failing on {#UNIFI.DEVICE.NAME}
          priority: WARNING
          description: The documented Integration API statistics/latest endpoint is returning an error or invalid JSON.
      - uuid: a8809a7c0079593db6c8171735742c0c
        name: Official API statistics last error on {#UNIFI.DEVICE.NAME}
        type: DEPENDENT
        key: unifi.official.stats.error[{#UNIFI.DEVICE.ID}]
        history: 30d
        value_type: TEXT
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'try { var data = JSON.parse(value); if (!data.error) { return ""; } return data.error + (data.details ? ": "
            + data.details : ""); } catch (e) { return "invalid JSON: " + e.message; }'
        master_item:
          key: unifi_udm_pro_api_unified.py["device-stats","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.SITE.ID}","{#UNIFI.DEVICE.ID}","{$UNIFI.TLS.ARG}"]
        tags:
        - tag: component
          value: collector
        - tag: source
          value: official-api
      - uuid: 532ee69fde21551db38564ea66491a82
        name: Official CPU utilization on {#UNIFI.DEVICE.NAME}
        type: DEPENDENT
        key: unifi.official.system.cpu.percent[{#UNIFI.DEVICE.ID}]
        history: 90d
        value_type: FLOAT
        units: '%'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.cpuUtilizationPct
        master_item:
          key: unifi_udm_pro_api_unified.py["device-stats","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.SITE.ID}","{#UNIFI.DEVICE.ID}","{$UNIFI.TLS.ARG}"]
        tags:
        - tag: component
          value: system
        - tag: source
          value: official-api
      - uuid: be2e18d5ad975cc7a35e99e265fa1c9f
        name: Official memory utilization on {#UNIFI.DEVICE.NAME}
        type: DEPENDENT
        key: unifi.official.system.memory.percent[{#UNIFI.DEVICE.ID}]
        history: 90d
        value_type: FLOAT
        units: '%'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.memoryUtilizationPct
        master_item:
          key: unifi_udm_pro_api_unified.py["device-stats","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.SITE.ID}","{#UNIFI.DEVICE.ID}","{$UNIFI.TLS.ARG}"]
        tags:
        - tag: component
          value: system
        - tag: source
          value: official-api
      - uuid: 2e4ffbcf1d5e5fa7a8b05afa6e3422d5

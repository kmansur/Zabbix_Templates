  triggers:
  - uuid: 29d90f51d5d14b66b8e8548a085c4669
    expression: last(/UniFi UDM Pro API Monitoring Unified RC/unifi.vpn.enabled)>0 and last(/UniFi UDM Pro API Monitoring
      Unified RC/unifi.vpn.up)<last(/UniFi UDM Pro API Monitoring Unified RC/unifi.vpn.enabled)
    name: One or more UniFi VPN tunnels are down
    opdata: 'Up: {ITEM.LASTVALUE1}'
    priority: WARNING
  - uuid: 68548320ae9e478ea49c7bce53b47ba2
    expression: last(/UniFi UDM Pro API Monitoring Unified RC/unifi.ids.enabled)=1 and last(/UniFi UDM Pro API Monitoring
      Unified RC/unifi.ids.signature.age)>{$UNIFI.IDS.SIGNATURE.MAX_AGE}
    name: UniFi IDS/IPS signature data is stale
    opdata: 'Signature age: {ITEM.LASTVALUE1}'
    priority: WARNING
  - uuid: f4192f6ee2524f35968a55ab9e18b799
    expression: last(/UniFi UDM Pro API Monitoring Unified RC/unifi.wan.primary.active)=0 and last(/UniFi UDM Pro API Monitoring
      Unified RC/unifi.wan.failover.enabled)=1
    name: UniFi WAN primary link is not active
    priority: WARNING
    description: The UDM reports a non-primary WAN as the active uplink while multi-WAN/failover is available.

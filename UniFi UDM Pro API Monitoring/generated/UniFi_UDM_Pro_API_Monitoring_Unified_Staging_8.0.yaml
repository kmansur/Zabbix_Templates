    macros:
    - macro: '{$UNIFI.API.KEY}'
      type: SECRET_TEXT
      description: Local UniFi Network API key generated in UniFi Network > Integrations.
    - macro: '{$UNIFI.API.URL}'
      value: https://xxx.xxx.xxx.xxx
      description: Base URL of the UDM Pro. The script appends /proxy/network/integration/v1 automatically.
    - macro: '{$UNIFI.TLS.ARG}'
      value: --timeout=20
      description: Collector TLS argument. Keep --timeout=20 for compatibility with self-signed consoles, or set --verify-tls
        to validate the HTTPS certificate.
    - macro: '{$UNIFI.CPU.WARN}'
      value: '85'
      description: CPU utilization warning threshold in percent.
    - macro: '{$UNIFI.IDS.SIGNATURE.MAX_AGE}'
      value: '604800'
      description: Maximum accepted age for IDS/IPS signature data, in seconds.
    - macro: '{$UNIFI.LLD.OFFICIAL.STATS.MODEL.MATCHES}'
      value: (?i)^(UDM.*|UCG.*|UXG.*)$
      description: Gateway model regex included in official Integration API statistics/latest discovery.
    - macro: '{$UNIFI.LLD.CLIENT.TYPE.MATCHES}'
      value: .*
      description: Regular expression for UniFi client types included in low-level discovery.
    - macro: '{$UNIFI.LLD.DEVICE.MODEL.MATCHES}'
      value: .*
      description: Regular expression for UniFi device models included in low-level discovery.
    - macro: '{$UNIFI.LLD.DEVICE.NAME.MATCHES}'
      value: .*
      description: Regular expression for UniFi device names included in low-level discovery.
    - macro: '{$UNIFI.LLD.NETWORK.NAME.MATCHES}'
      value: .*
      description: Regular expression for UniFi networks included in low-level discovery.
    - macro: '{$UNIFI.LLD.PORT.IDX.MATCHES}'
      value: .*
      description: Regular expression for Integration API port indexes included in low-level discovery.
    - macro: '{$UNIFI.LLD.PORT.NAME.MATCHES}'
      value: .*
      description: Regular expression for Port names included in low-level discovery.
    - macro: '{$UNIFI.LLD.RADIO.BAND.MATCHES}'
      value: .*
      description: Regular expression for radio bands included in low-level discovery.
    - macro: '{$UNIFI.LLD.RADIO.INDEX.MATCHES}'
      value: .*
      description: Regular expression for Integration API radio indexes included in low-level discovery.
    - macro: '{$UNIFI.LLD.STORAGE.MOUNT.MATCHES}'
      value: .*
      description: Regular expression for storage mount points included in low-level discovery.
    - macro: '{$UNIFI.LLD.WAN.NAME.MATCHES}'
      value: .*
      description: Regular expression for WAN labels included in low-level discovery.
    - macro: '{$UNIFI.MEMORY.WARN}'
      value: '90'
      description: Memory utilization warning threshold in percent.
    - macro: '{$UNIFI.NETWORK.SITE}'
      value: default
      description: UniFi Network site reference used by /proxy/network/api/s/<site>/stat/device.
    - macro: '{$UNIFI.POE.BUDGET.WARN}'
      value: '80'
      description: Device-level PoE budget utilization warning threshold in percent.
    - macro: '{$UNIFI.RADIO.RETRY.WARN}'
      value: '20'
      description: Radio retry percentage warning threshold.
    - macro: '{$UNIFI.RADIO.SATISFACTION.MIN}'
      value: '60'
      description: Minimum acceptable radio satisfaction percentage.
    - macro: '{$UNIFI.RADIO.UTIL.WARN}'
      value: '80'
      description: Radio channel utilization warning threshold in percent.
    - macro: '{$UNIFI.SITE.ID}'
      description: Optional site ID. Leave empty when the controller has only one site.
    - macro: '{$UNIFI.SPEEDTEST.MAX_AGE}'
      value: '172800'
      description: Maximum accepted age for the last WAN speedtest result, in seconds.
    - macro: '{$UNIFI.STORAGE.WARN}'
      value: '85'
      description: Storage utilization warning threshold in percent.
    - macro: '{$UNIFI.TEMP.WARN}'
      value: '75'
      description: CPU temperature warning threshold in Celsius.
    - macro: '{$UNIFI.UPTIME.REBOOT.WINDOW}'
      value: 10m
      description: Window used to detect recent gateway reboot from uptime.
    - macro: '{$UNIFI.WAN.AVAILABILITY.MIN}'
      value: '99'
      description: Minimum acceptable WAN availability percentage.
    - macro: '{$UNIFI.WAN.LATENCY.WARN}'
      value: '100'
      description: WAN latency warning threshold in milliseconds.
    - macro: '{$UNIFI.WAN.LOSS.WARN}'
      value: '1'
      description: WAN packet loss warning threshold in percent.

zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: 9a7b1f8ac78a4c27aa0aa540c6485078
      name: 'Templates/Network devices'
  templates:
    - uuid: 1106dc5178b84ce9a7c6986128604c93
      template: 'UniFi UDM Pro API Monitoring'
      name: 'UniFi UDM Pro API Monitoring'
      description: |
        Template for monitoring a Ubiquiti UniFi Dream Machine Pro through the
        local UniFi Network API. Version 0.7.0 adds parallel collection from the
        documented Integration API statistics/latest endpoint for Network 10.6
        validation while retaining existing legacy telemetry for compatibility.
        
        Requires the external script unifi_udm_pro_api.py in the Zabbix server
        or proxy external scripts directory.
      vendor:
        name: 'Net Tech'
        version: 0.7-0
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 6254713021174394af4ad792e6afd651
          name: 'UniFi Network application version'
          type: DEPENDENT
          key: unifi.api.application_version
          history: 90d
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.applicationVersion
          master_item:
            key: 'unifi_udm_pro_api.py["info","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.TLS.ARG}"]'
          tags:
            - tag: component
              value: api
          triggers:
            - uuid: 5d99c50b81584b3eb6cb5f4bf7b51582
              expression: 'last(/UniFi UDM Pro API Monitoring/unifi.api.application_version,#1)<>last(/UniFi UDM Pro API Monitoring/unifi.api.application_version,#2)'
              name: 'UniFi Network application version changed'
              opdata: 'Current version: {ITEM.LASTVALUE1}'
              priority: INFO
              manual_close: 'YES'
        - uuid: 77de80b9934942a7a5a801e504af4776
          name: 'UniFi clients total'
          type: DEPENDENT
          key: unifi.clients.total
          history: 90d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.total
          master_item:
            key: 'unifi_udm_pro_api.py["summary-clients","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.SITE.ID}","{$UNIFI.TLS.ARG}"]'
          tags:
            - tag: component
              value: clients
        - uuid: 8bd0bdd5b4c54db6891e43ac5d2e447d
          name: 'UniFi wired clients'
          type: DEPENDENT
          key: unifi.clients.wired
          history: 90d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.wired
          master_item:
            key: 'unifi_udm_pro_api.py["summary-clients","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.SITE.ID}","{$UNIFI.TLS.ARG}"]'
          tags:
            - tag: component
              value: clients
        - uuid: bd789bd5599a44f89052bd86c47291bd
          name: 'UniFi wireless clients'
          type: DEPENDENT
          key: unifi.clients.wireless
          history: 90d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.wireless
          master_item:
            key: 'unifi_udm_pro_api.py["summary-clients","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.SITE.ID}","{$UNIFI.TLS.ARG}"]'
          tags:
            - tag: component
              value: clients
        - uuid: 9d38c15e9bb04ee4bf105022e7fed628
          name: 'UniFi Integration API collection available'
          type: DEPENDENT
          key: unifi.collector.integration.available
          history: 90d
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'try { var data = JSON.parse(value); return data.error ? 0 : 1; } catch (e) { return 0; }'
          master_item:
            key: 'unifi_udm_pro_api.py["info","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.TLS.ARG}"]'
          tags:
            - tag: component
              value: collector
          triggers:
            - uuid: 5b7725bf8cad4f01bd4a49acac225b12
              expression: 'max(/UniFi UDM Pro API Monitoring/unifi.collector.integration.available,10m)=0'
              name: 'UniFi Integration API collection is failing'
              priority: HIGH
              description: 'The Integration API master item is returning an error or invalid JSON.'
        - uuid: 1f17bbedaa0045c8932205b2f067c8d4
          name: 'UniFi Integration API last error'
          type: DEPENDENT
          key: unifi.collector.integration.error
          history: 30d
          value_type: TEXT

zabbix_export:
  version: '8.0'
  template_groups:
  - uuid: 1b794a4f8433489f8299cbbbfb01b425
    name: Templates/Network devices
  templates:
  - uuid: 0aa3f147d40348929e69a12e7c0a3edf
    template: UniFi UDM Pro Dashboard Telemetry
    name: UniFi UDM Pro Dashboard Telemetry
    description: 'Companion template for UniFi UDM Pro API Monitoring >= 0.7.0.


      Adds dashboard-oriented telemetry used by Zabbix-UniFi-Dashboard:

      per-client traffic ranking, wireless RSSI, DPI application traffic, and

      Wi-Fi association/authentication/DHCP/DNS success metrics when exposed

      by the installed UniFi Network release.


      Requires unifi_dashboard_telemetry.py in the Zabbix external scripts

      directory. The host must already provide the macros {$UNIFI.API.URL},

      {$UNIFI.API.KEY}, {$UNIFI.NETWORK.SITE}, and {$UNIFI.TLS.ARG}; the base

      UniFi UDM Pro API Monitoring template already defines them.


      The controller-local v2 Wi-Fi performance endpoint is treated as

      optional because API-key access can vary by UniFi Network release.

      '
    vendor:
      name: Net Tech
      version: 0.8-0-rc1
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 439ba25c21fa469a999cd65cb1a26a90
      name: UniFi dashboard clients telemetry raw
      type: EXTERNAL
      key: unifi_dashboard_telemetry.py["clients","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
      delay: 2m
      history: 1d
      value_type: TEXT
      trends: '0'
      timeout: 60s
      tags:
      - tag: component
        value: dashboard-telemetry
      - tag: component
        value: clients
    - uuid: 72acc55726bf43dfae85c106499b4131
      name: UniFi dashboard client telemetry available
      type: DEPENDENT
      key: unifi.dashboard.clients.available
      delay: '0'
      history: 90d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'try { var d=JSON.parse(value); return d.error ? 0 : 1; } catch (e) { return 0; }'
      master_item:
        key: unifi_dashboard_telemetry.py["clients","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
      tags:
      - tag: component
        value: collector
      - tag: scope
        value: availability
      triggers:
      - uuid: f4f47261a34848ce8eb7a8869296646f
        expression: max(/UniFi UDM Pro Dashboard Telemetry/unifi.dashboard.clients.available,10m)=0
        name: UniFi dashboard client telemetry collection is failing
        priority: WARNING
    - uuid: ae8a27ef98624203bf16120d1f2a3024
      name: UniFi dashboard DPI telemetry raw
      type: EXTERNAL
      key: unifi_dashboard_telemetry.py["dpi","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
      delay: 5m
      history: 1d
      value_type: TEXT
      trends: '0'
      timeout: 60s
      tags:
      - tag: component
        value: dashboard-telemetry
      - tag: component
        value: dpi
    - uuid: e85f69591e134859acb4a9a249701026
      name: UniFi dashboard DPI telemetry available
      type: DEPENDENT
      key: unifi.dashboard.dpi.available
      delay: '0'
      history: 90d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'try { var d=JSON.parse(value); return d.error ? 0 : 1; } catch (e) { return 0; }'
      master_item:
        key: unifi_dashboard_telemetry.py["dpi","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
      tags:
      - tag: component
        value: collector
      - tag: scope
        value: availability
      triggers:
      - uuid: 3a57b828e3484001ac5a65f0ae744aaa
        expression: max(/UniFi UDM Pro Dashboard Telemetry/unifi.dashboard.dpi.available,15m)=0
        name: UniFi dashboard DPI telemetry collection is failing
        priority: WARNING
    - uuid: 54b051c0d9c346c5a4025854c01003a9
      name: UniFi Wi-Fi connectivity performance raw
      type: EXTERNAL
      key: unifi_dashboard_telemetry.py["wifi-performance","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
      delay: 2m
      history: 1d
      value_type: TEXT
      trends: '0'
      timeout: 60s
      tags:
      - tag: component
        value: dashboard-telemetry
      - tag: component
        value: wifi
    - uuid: aa2b235deb3743d38fd5309ebe2b290c
      name: UniFi Wi-Fi connectivity telemetry available
      type: DEPENDENT
      key: unifi.dashboard.wifi.performance.available
      delay: '0'
      history: 90d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'try { var d=JSON.parse(value); return d.available === true ? 1 : 0; } catch (e) { return 0; }'
      master_item:
        key: unifi_dashboard_telemetry.py["wifi-performance","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
      tags:
      - tag: component
        value: collector
      - tag: scope
        value: availability
    - uuid: 6aebeb4d8136421d922d3a74facc9f1b
      name: UniFi Wi-Fi association success
      type: DEPENDENT
      key: unifi.wifi.association.success
      delay: '0'
      history: 90d
      value_type: CHAR
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'try { var d=JSON.parse(value), v=d.association; return (v === null || typeof v === "undefined") ? "" : v; } catch (e) { return ""; }'
      master_item:
        key: unifi_dashboard_telemetry.py["wifi-performance","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
      tags:
      - tag: component
        value: wifi
    - uuid: df172b850ff0484d9213a556ebe24958
      name: UniFi Wi-Fi authentication success
      type: DEPENDENT
      key: unifi.wifi.authentication.success
      delay: '0'
      history: 90d
      value_type: CHAR
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'try { var d=JSON.parse(value), v=d.authentication; return (v === null || typeof v === "undefined") ? "" : v; } catch (e) { return ""; }'
      master_item:
        key: unifi_dashboard_telemetry.py["wifi-performance","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
      tags:
      - tag: component
        value: wifi
    - uuid: 3b66e6110ba949f4ae5ac6792165b8a9
      name: UniFi Wi-Fi DHCP success
      type: DEPENDENT
      key: unifi.wifi.dhcp.success
      delay: '0'
      history: 90d
      value_type: CHAR
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'try { var d=JSON.parse(value), v=d.dhcp; return (v === null || typeof v === "undefined") ? "" : v; } catch (e) { return ""; }'
      master_item:
        key: unifi_dashboard_telemetry.py["wifi-performance","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
      tags:
      - tag: component
        value: wifi
    - uuid: 9dc237d3c0554649b66ed7ea30381d61
      name: UniFi Wi-Fi DNS success
      type: DEPENDENT
      key: unifi.wifi.dns.success
      delay: '0'
      history: 90d
      value_type: CHAR
      trends: '0'
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - 'try { var d=JSON.parse(value), v=d.dns; return (v === null || typeof v === "undefined") ? "" : v; } catch (e) { return ""; }'
      master_item:
        key: unifi_dashboard_telemetry.py["wifi-performance","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
      tags:
      - tag: component
        value: wifi
    discovery_rules:
    - uuid: 62e5371d26ea412897cd2093e4e5766d
      name: UniFi dashboard client traffic discovery
      type: DEPENDENT
      key: unifi.dashboard.clients.traffic.discovery
      lifetime: 7d
      description: Discovers clients from the normalized stat/sta payload for dashboard ranking.
      item_prototypes:
      - uuid: 9b3065e09ae04e76b7b060f360986102
        name: UniFi client {#UNIFI.CLIENT.NAME} name
        type: DEPENDENT
        key: unifi.client.name[{#UNIFI.CLIENT.ID}]
        delay: '0'
        history: 7d
        value_type: CHAR
        trends: '0'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var d=JSON.parse(value), c=(d.clients||{})["{#UNIFI.CLIENT.ID}"]||{}; return c.name || "{#UNIFI.CLIENT.ID}";'
        master_item:
          key: unifi_dashboard_telemetry.py["clients","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
        tags:
        - tag: component
          value: clients
      - uuid: 13b54d8bea6a4bf4a1ad976fde6ca3af
        name: UniFi client {#UNIFI.CLIENT.NAME} traffic
        type: DEPENDENT
        key: unifi.client.traffic.bytes[{#UNIFI.CLIENT.ID}]
        delay: '0'
        history: 30d
        units: B
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var d=JSON.parse(value), c=(d.clients||{})["{#UNIFI.CLIENT.ID}"]||{}; return c.traffic_bytes || 0;'
        master_item:
          key: unifi_dashboard_telemetry.py["clients","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
        tags:
        - tag: component
          value: clients
      master_item:
        key: unifi_dashboard_telemetry.py["clients","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d=JSON.parse(value), out=[], clients=d.clients||{};
          Object.keys(clients).forEach(function(id) {
            var c=clients[id]||{};
            out.push({"{#UNIFI.CLIENT.ID}":id,"{#UNIFI.CLIENT.NAME}":c.name||id});
          });
          return JSON.stringify(out);
    - uuid: 2e8b72224a82434ab1374f1627d6aa34
      name: UniFi dashboard wireless RSSI discovery
      type: DEPENDENT
      key: unifi.dashboard.clients.rssi.discovery
      lifetime: 7d
      description: Discovers wireless clients that expose a negative dBm signal value.
      item_prototypes:
      - uuid: f980e3d5fc9c43049faa53a4896a57a7
        name: UniFi wireless client {#UNIFI.CLIENT.NAME} RSSI
        type: DEPENDENT
        key: unifi.radio.rssi[{#UNIFI.CLIENT.ID}]
        delay: '0'
        history: 30d
        value_type: FLOAT
        units: dBm
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var d=JSON.parse(value), c=(d.clients||{})["{#UNIFI.CLIENT.ID}"]||{}; return c.rssi;'
        master_item:
          key: unifi_dashboard_telemetry.py["clients","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
        tags:
        - tag: component
          value: wifi
        - tag: component
          value: clients
      master_item:
        key: unifi_dashboard_telemetry.py["clients","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d=JSON.parse(value), out=[], clients=d.clients||{};
          Object.keys(clients).forEach(function(id) {
            var c=clients[id]||{};
            if (c.rssi !== null && typeof c.rssi !== "undefined") {
              out.push({"{#UNIFI.CLIENT.ID}":id,"{#UNIFI.CLIENT.NAME}":c.name||id});
            }
          });
          return JSON.stringify(out);
    - uuid: f7e8d0f4d2184591b03522e866160d12
      name: UniFi dashboard DPI application discovery
      type: DEPENDENT
      key: unifi.dashboard.dpi.app.discovery
      lifetime: 30d
      description: Discovers DPI applications returned by site-wide by_app statistics.
      item_prototypes:
      - uuid: 3d0dff7e052f4853a8b8b3ae463e44f6
        name: UniFi DPI application {#UNIFI.DPI.APP.NAME} name
        type: DEPENDENT
        key: unifi.dpi.app.name[{#UNIFI.DPI.APP.ID}]
        delay: '0'
        history: 30d
        value_type: CHAR
        trends: '0'
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var d=JSON.parse(value), a=(d.applications||{})["{#UNIFI.DPI.APP.ID}"]||{}; return a.name || "{#UNIFI.DPI.APP.ID}";'
        master_item:
          key: unifi_dashboard_telemetry.py["dpi","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
        tags:
        - tag: component
          value: dpi
      - uuid: 8558fd8f681c4abaa9b08d562c066285
        name: UniFi DPI application {#UNIFI.DPI.APP.NAME} traffic
        type: DEPENDENT
        key: unifi.dpi.app.bytes[{#UNIFI.DPI.APP.ID}]
        delay: '0'
        history: 30d
        units: B
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - 'var d=JSON.parse(value), a=(d.applications||{})["{#UNIFI.DPI.APP.ID}"]||{}; return a.bytes || 0;'
        master_item:
          key: unifi_dashboard_telemetry.py["dpi","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
        tags:
        - tag: component
          value: dpi
      master_item:
        key: unifi_dashboard_telemetry.py["dpi","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.NETWORK.SITE}","{$UNIFI.TLS.ARG}"]
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |
          var d=JSON.parse(value), out=[], apps=d.applications||{};
          Object.keys(apps).forEach(function(id) {
            var a=apps[id]||{};
            out.push({"{#UNIFI.DPI.APP.ID}":id,"{#UNIFI.DPI.APP.NAME}":a.name||id});
          });
          return JSON.stringify(out);

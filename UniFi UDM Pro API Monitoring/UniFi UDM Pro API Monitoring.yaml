      macros:
        - macro: '{$UNIFI.API.URL}'
          value: 'https://xxx.xxx.xxx.xxx'
          description: 'Base URL of the UDM Pro. The script appends /proxy/network/integration/v1 automatically.'
        - macro: '{$UNIFI.API.KEY}'
          value: ''
          type: SECRET_TEXT
          description: 'Local UniFi Network API key generated in Control Plane > Integrations.'
        - macro: '{$UNIFI.SITE.ID}'
          value: ''
          description: 'Optional site ID. Leave empty when the controller has only one site.'
        - macro: '{$UNIFI.LEGACY.SITE}'
          value: default
          description: 'Legacy UniFi Network site reference used by /proxy/network/api/s/<site>/stat/device.'
        - macro: '{$UNIFI.DEVICE.ID}'
          value: ''
          description: 'Optional UniFi external device ID for system health. Leave empty to use the first UDM device.'
        - macro: '{$UNIFI.CPU.WARN}'
          value: '85'
          description: 'CPU utilization warning threshold in percent.'
        - macro: '{$UNIFI.MEMORY.WARN}'
          value: '90'
          description: 'Memory utilization warning threshold in percent.'
        - macro: '{$UNIFI.STORAGE.WARN}'
          value: '85'
          description: 'Storage utilization warning threshold in percent.'
        - macro: '{$UNIFI.TEMP.WARN}'
          value: '75'
          description: 'CPU temperature warning threshold in Celsius.'
        - macro: '{$UNIFI.WAN.LATENCY.WARN}'
          value: '100'
          description: 'WAN latency warning threshold in milliseconds.'
        - macro: '{$UNIFI.WAN.LOSS.WARN}'
          value: '1'
          description: 'WAN packet loss warning threshold in percent.'
        - macro: '{$UNIFI.SPEEDTEST.MAX_AGE}'
          value: '172800'
          description: 'Maximum accepted age for the last WAN speedtest result, in seconds.'

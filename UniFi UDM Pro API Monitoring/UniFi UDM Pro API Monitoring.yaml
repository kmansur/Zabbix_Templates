zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 9a7b1f8ac78a4c27aa0aa540c6485078
      name: Templates/Network devices
  templates:
    - uuid: 1106dc5178b84ce9a7c6986128604c93
      template: 'UniFi UDM Pro API Monitoring'
      name: 'UniFi UDM Pro API Monitoring'
      description: |
        Template for monitoring a Ubiquiti UniFi Dream Machine Pro through the
        local UniFi Network API.

        Requires the external script unifi_udm_pro_api.py in the Zabbix server
        or proxy external scripts directory.
      vendor:
        name: 'Net Tech'
        version: 0.5-0
      groups:
        - name: Templates/Network devices
      items:
        - uuid: e404f614f7c0453ca21b8a94a2d64a63
          name: 'UniFi API info raw'
          type: EXTERNAL
          key: 'unifi_udm_pro_api.py["info","{$UNIFI.API.URL}","{$UNIFI.API.KEY}"]'
          delay: 1h
          history: 7d
          value_type: TEXT
          trends: '0'
          timeout: 30s
          tags:
            - tag: component
              value: api
        - uuid: 6254713021174394af4ad792e6afd651
          name: 'UniFi Network application version'
          type: DEPENDENT
          key: unifi.api.application_version
          delay: '0'
          history: 90d
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.applicationVersion
          master_item:
            key: 'unifi_udm_pro_api.py["info","{$UNIFI.API.URL}","{$UNIFI.API.KEY}"]'
          tags:
            - tag: component
              value: api
          triggers:
            - uuid: 5d99c50b81584b3eb6cb5f4bf7b51582
              expression: 'last(/UniFi UDM Pro API Monitoring/unifi.api.application_version,#1)<>last(/UniFi UDM Pro API Monitoring/unifi.api.application_version,#2)'
              name: 'UniFi Network application version changed'
              opdata: 'Current version: {ITEM.LASTVALUE1}'
              priority: INFO
              manual_close: 'YES'
        - uuid: 3dab808867e84e04a4234104afc18a8c
          name: 'UniFi devices summary raw'
          type: EXTERNAL
          key: 'unifi_udm_pro_api.py["summary-devices","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.SITE.ID}"]'
          delay: 2m
          history: 7d
          value_type: TEXT
          trends: '0'
          timeout: 30s
          tags:
            - tag: component
              value: devices
        - uuid: 3f9d82832f254b5aa7f0443287f1b34d
          name: 'UniFi devices total'
          type: DEPENDENT
          key: unifi.devices.total
          delay: '0'
          history: 90d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.total
          master_item:
            key: 'unifi_udm_pro_api.py["summary-devices","{$UNIFI.API.URL}","{$UNIFI.API.KEY}","{$UNIFI.SITE.ID}"]'
          tags:
            - tag: component

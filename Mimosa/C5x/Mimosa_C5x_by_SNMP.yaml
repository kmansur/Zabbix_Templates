        - uuid: 9f63d24dc38b4f67bec080e41269c6f6
          name: 'Clock accuracy'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.2.8.0
          key: mimosaClockAccuracy.0
          delay: 5m
          history: 365d
          value_type: FLOAT
          units: ppb
          description: 'Timing signal accuracy in parts per billion (PPB).'
          preprocessing:
            - type: REGEX
              parameters:
                - '^([0-9]+(?:\.[0-9]+)?)'
                - \1
          tags:
            - tag: Application
              value: Location
          triggers:
            - uuid: 6fea966b80304557b4a71f4a071aa81f
              expression: 'last(/Mimosa C5x by SNMP/mimosaClockAccuracy.0)>1000'
              name: 'Clock accuracy worse than 1000 ppb'
              priority: WARNING
              manual_close: 'YES'
        - uuid: e97c290aaeb341e8bff6dcd930f2bfdd
          name: 'Device name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.1.1.0
          key: mimosaDeviceName.0
          delay: 1h
          history: 365d
          value_type: CHAR
          trends: '0'
          description: 'Displays name for device'
          tags:
            - tag: Application

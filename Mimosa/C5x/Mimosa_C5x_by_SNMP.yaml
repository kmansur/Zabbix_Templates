        - uuid: debd1a109c9d4be797f34abcf89c59a2
          name: 'Wireless MAC RX throughput'
          type: CALCULATED
          key: mimosaRxMacTotal.0
          history: 365d
          units: bps
          params: '.60*last(//mimosaRxPhyTotal.0)'
          tags:
            - tag: Application
              value: Wireless
          triggers:
            - uuid: 59fd37dbebdc42a8a146866afc937e66
              expression: 'last(/Mimosa C5x by SNMP/mimosaRxMacTotal.0)<75000000'
              name: 'Wireless RX interface speed low ({ITEM.LASTVALUE1})'
              priority: HIGH
              manual_close: 'YES'
        - uuid: 0310a57559ac4c23b2b1d2fc653ae29d

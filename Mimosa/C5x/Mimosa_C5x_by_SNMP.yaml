            - tag: Application
              value: 'Radio Information - Chains Table'
        - uuid: 590c9d2392c74b22bb13b23cb62e2cfe
          name: 'Wireless RX power chain 2'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.6.1.1.3.2
          key: mimosaRxPower.2
          delay: '30'
          history: 365d
          value_type: FLOAT

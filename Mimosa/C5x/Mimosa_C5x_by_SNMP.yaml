              name: 'Device rebooted (uptime < 10m)'
              priority: AVERAGE
              manual_close: 'YES'
      macros:
        - macro: '{$MIMOSA_MAX_PER}'
          value: '3'
          description: 'Maximum acceptable wireless packet error rate (PER) in percent over 5 minutes.'
        - macro: '{$MIMOSA_MIN_MARGIN}'

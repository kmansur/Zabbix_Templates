              parameters:
                - '0.1'
          tags:
            - tag: Application
              value: Wireless
          triggers:
            - uuid: 03081437ec444ad1972298b3beeac2c6
              expression: 'last(/Mimosa C5x by SNMP/mimosaTotalRxPower.0)<{$MIMOSA_MIN_RX}'
              name: 'Wireless link signal out of range {ITEM.LASTVALUE}'
              priority: HIGH
              manual_close: 'YES'
        - uuid: 254ae2fe687b4fcabce7b831a4269dfd
          name: 'Wireless total TX power'

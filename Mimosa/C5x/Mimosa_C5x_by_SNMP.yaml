          description: 'Longitude of the device location (5 decimal places).'
          tags:
            - tag: Application
              value: Location
        - uuid: aa6c14dea9a3463d8a839486fc32bc2e
          name: 'Wireless MAC total throughput'
          type: CALCULATED
          key: mimosaMacTotal.0
          history: 365d
          units: bps
          params: last(//mimosaRxMacTotal.0)+last(//mimosaTxMacTotal.0)
          tags:
            - tag: Application
              value: Wireless
        - uuid: c6af8dcef13b4324ba390646abe460ec
          name: 'NTP mode'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.8.7.0
          key: mimosaNtpMode.0
          delay: 1h
          history: 365d
          description: 'Current NTP mode configured on the device.'
          tags:
            - tag: Application
              value: 'General information'
        - uuid: 2fe489e082e74c1eb8ad7bab553dba1e
          name: 'NTP server'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.8.8.0
          key: mimosaNtpServer.0
          delay: 1h
          history: 365d
          value_type: CHAR
          trends: '0'
          description: 'Configured NTP server address.'
          tags:
            - tag: Application
              value: 'General information'
        - uuid: 0ea3ffe5c1654b06ac72043ad8c9088c
          name: 'Wireless RX packet error rate (%)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.7.4.0
          key: mimosaPerRxRate.0
          delay: '5'
          history: 365d
          value_type: FLOAT
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: Application
              value: Wireless
          triggers:
            - uuid: 10244a4d3c1349d4b092e7873dd630e8
              expression: 'avg(/Mimosa C5x by SNMP/mimosaPerRxRate.0,5m)>{$MIMOSA_MAX_PER}'
              name: 'Wireless RX packet error rate > {$MIMOSA_MAX_PER}%'
              priority: WARNING
        - uuid: dc91f10421bc4988a330400164452894
          name: 'Wireless TX packet error rate (%)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.7.3.0
          key: mimosaPerTxRate.0
          delay: '5'
          history: 365d
          value_type: FLOAT
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: Application
              value: Wireless
          triggers:
            - uuid: 4634d64467eb4f5482dd17fd8a7834e7
              expression: 'avg(/Mimosa C5x by SNMP/mimosaPerTxRate.0,5m)>{$MIMOSA_MAX_PER}'
              name: 'Wireless TX packet error rate > {$MIMOSA_MAX_PER}%'
              priority: WARNING
        - uuid: 85f6bc55abc3424db755afd05f257345
          name: 'Wireless RX PHY rate'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.7.2.0
          key: mimosaPhyRxRate.0
          history: 365d
          units: bps
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: Application
              value: Wireless
        - uuid: 42366f2d1c6f47e092177c4334fc9c4d
          name: 'Wireless TX PHY rate'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.7.1.0
          key: mimosaPhyTxRate.0
          history: 365d
          units: bps
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: Application
              value: Wireless
        - uuid: 628ec800499045ac80a065973ee13f2f
          name: 'Regulatory domain country'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.1.9.0
          key: mimosaRegulatoryDomain.0
          delay: 1h
          history: 365d
          value_type: CHAR
          trends: '0'
          description: 'Displays regulatory domain for device'
          tags:
            - tag: Application

          name: 'Wireless RX PHY speed 1'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.6.2.1.5.1
          key: mimosaRxPhy.1
          history: 365d
          value_type: FLOAT
          units: bps
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1000000'
          tags:
            - tag: Application
              value: Wireless
        - uuid: df0d1435f3de41db8497e6af399be227
          name: 'Wireless RX PHY speed 2'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.6.2.1.5.2
          key: mimosaRxPhy.2
          history: 365d
          value_type: FLOAT
          units: bps
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1000000'
          tags:
            - tag: Application
              value: Wireless
        - uuid: 0ef1b3e7512c4432949729922963baec
          name: 'Wireless RX PHY speed total'
          type: CALCULATED
          key: mimosaRxPhyTotal.0
          delay: '10'
          history: 365d
          units: bps
          params: last(//mimosaRxPhy.1)+last(//mimosaRxPhy.2)
          tags:
            - tag: Application
              value: Wireless
        - uuid: 082aea843ce74fa5b23688c93866f0a9
          name: 'Wireless RX power chain 1'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.6.1.1.3.1
          key: mimosaRxPower.1
          delay: '30'
          history: 365d
          value_type: FLOAT
          units: dbm
          description: 'Displays wireless Rx Power 1 for device'

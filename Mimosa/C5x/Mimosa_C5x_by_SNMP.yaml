zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: 339dc321b20c49769b993dfaa6431c34
      template: 'Mimosa C5x by SNMP'
      name: 'Mimosa C5x by SNMP'
      description: |
        ## Description
        
        Template for Mimosa C5x radio using SNMP. Based on the original Mimosa C5c template by Dzset Tecnologia (www.dzset.com.br).
        
        ## Author
        
        Karim Mansur
        
        ## Required MIBs
        
        - MIMOSA-NETWORKS-BASE-MIB
        - MIMOSA-MIB-TC
        - MIMOSA-NETWORKS-BFIVE-MIB
        - IF-MIB
        - SNMPv2-MIB
        - SNMPv2-SMI
        - SNMPv2-TC
        
        This variant is adapted for Mimosa C5x (PTP or PTMP client). PTMP-only OIDs were removed to avoid unsupported items and thresholds are customizable via user macros.
      groups:
        - name: Templates
      items:
        - uuid: 014c4c3359e045cd94fdb0982262618f
          name: 'Ethernet (RJ45) RX discards'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.2.2.1.13.1
          key: ifInDiscards.1
          history: 30d
          description: 'Inbound packets discarded even though no errors were detected.'
          tags:
            - tag: Application
              value: LAN
        - uuid: e3d3acf2a8b54665a8bbc5232f6911d9
          name: 'Ethernet (RJ45) RX errors'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.2.2.1.14.1
          key: ifInErrors.1
          history: 30d
          description: 'Total number of inbound packets that contained errors.'
          tags:
            - tag: Application
              value: LAN
        - uuid: 991869d95e7543afa25c79596275cc4b
          name: 'Ethernet (RJ45) link state'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.2.2.1.8.1
          key: ifOperStatus.1
          delay: '30'
          history: 30d
          description: 'Operational state of the Ethernet port (1=up, 2=down).'
          tags:
            - tag: Application
              value: LAN
          triggers:
            - uuid: 715e03c1d4df43ffb2555489cfecb26b
              expression: 'last(/Mimosa C5x by SNMP/ifOperStatus.1)<>1'
              name: 'Ethernet (RJ45) link down'
              priority: HIGH
              manual_close: 'YES'
        - uuid: 0f698d95d3ec40ba86a09e0160ec1be4
          name: 'Ethernet (RJ45) TX discards'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.2.2.1.19.1
          key: ifOutDiscards.1
          history: 30d
          description: 'Outbound packets discarded for reasons other than errors.'
          tags:
            - tag: Application
              value: LAN
        - uuid: b5c7aa125fac479fad59a01cdd4f1605
          name: 'Ethernet (RJ45) TX errors'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.2.2.1.20.1
          key: ifOutErrors.1
          history: 30d
          description: 'Total number of outbound packets that could not be transmitted because of errors.'
          tags:
            - tag: Application
              value: LAN
        - uuid: 4a82687f61d840758b0f23f7de0f3e7d
          name: 'Ethernet (RJ45) speed'
          type: SNMP_AGENT
          snmp_oid: iso.3.6.1.2.1.2.2.1.5.1
          key: ifSpeed.1
          delay: 3m
          history: 90d
          value_type: FLOAT
          units: bps
          tags:
            - tag: Application
              value: LAN
          triggers:
            - uuid: fa4c9dde2e504748878bb622dae7c61f
              expression: 'last(/Mimosa C5x by SNMP/ifSpeed.1)<1000000000'
              name: 'LAN port speed below expected ({ITEM.LASTVALUE1})'
              priority: HIGH
              manual_close: 'YES'
        - uuid: c27271fedaf94e05ac2c82d4de4e0e67
          name: 'Device altitude'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.2.3.0
          key: mimosaAltitude.0
          delay: 1h
          history: 365d
          units: m
          description: 'Altitude of the device in meters.'
          tags:
            - tag: Application
              value: Location
        - uuid: 8aec2b0f00ab4feeb659cca76b6731b8
          name: 'Wireless antenna gain'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.6.4.0
          key: mimosaAntennaGain.0
          delay: 1h

          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.6.1.1.5.2
          key: mimosaSNR.2
          delay: 5m
          history: 365d
          units: dB
          description: 'Signal-to-noise ratio (SNR) for RF chain 2.'

        - uuid: 9d2fb3310e4f4eea95b1daaaf400231c
          name: 'Wireless signal margin'
          type: CALCULATED
          key: mimosaSignalMargin.0
          delay: '30'
          history: 365d
          value_type: FLOAT
          units: dB
          params: last(//mimosaTotalRxPower.0)-last(//mimosaTargetSignalStrength.0)
          description: 'Difference between actual total RX power and target signal strength.'
          tags:
            - tag: Application
              value: Wireless
          triggers:
            - uuid: 90029646283a47a1a920200fd49b8aa1
              expression: 'last(/Mimosa C5x by SNMP/mimosaSignalMargin.0)<{$MIMOSA_MIN_MARGIN}'

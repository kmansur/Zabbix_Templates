          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.43356.2.1.2.4.4.0
          key: mimosaTDMAWindow.0
          delay: '3600'
          history: 365d
          value_type: FLOAT
          units: ms
          description: 'Displays wireless TDMA window for device'
          tags:

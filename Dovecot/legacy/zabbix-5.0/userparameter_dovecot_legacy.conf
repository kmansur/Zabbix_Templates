# Dovecot legacy monitoring UserParameters for Zabbix agent
# Version: 1.0.0 compatibility
# Notes:
# - Use with legacy/zabbix-5.0/Template_App_Dovecot.xml.
# - sudo -n is used to fail fast when sudoers permissions are missing.
# - Copy dovecot_num_imap.sh and dovecot_num_pop.sh to /usr/local/scripts/ before enabling these keys.

UserParameter=dovecot.imap,sudo -n /usr/local/scripts/dovecot_num_imap.sh
UserParameter=dovecot.pop,sudo -n /usr/local/scripts/dovecot_num_pop.sh
UserParameter=dovecot.version,/usr/local/sbin/dovecot --version | /usr/bin/awk '{print $1}'

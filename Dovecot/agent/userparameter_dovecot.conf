# Dovecot monitoring UserParameters for Zabbix agent
# Version: 3.0.0
#
# Security:
# - The collector runs as the Zabbix agent user.
# - Do NOT grant sudo permission for dovecot_stats.sh.
# - If direct doveadm access is not available, sudoers must allow only the
#   exact "doveadm who -1" command. See agent/sudoers.d/ examples.

UserParameter=dovecot.stats,/usr/local/scripts/dovecot_stats.sh stats
UserParameter=dovecot.version,/usr/local/scripts/dovecot_stats.sh version
UserParameter=dovecot.collector.version,/usr/local/scripts/dovecot_stats.sh collector-version

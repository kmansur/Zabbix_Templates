# Dovecot monitoring UserParameters for Zabbix agent
# Version: 2.0.0
# Notes:
# - sudo -n is used to fail fast when sudoers permissions are missing.
# - Keep script ownership restricted, for example root:wheel on FreeBSD or root:root on Linux.
# - Legacy dovecot.imap and dovecot.pop keys live in legacy/zabbix-5.0/userparameter_dovecot_legacy.conf.

UserParameter=dovecot.stats,sudo -n /usr/local/scripts/dovecot_stats.sh
UserParameter=dovecot.version,/usr/local/sbin/dovecot --version | /usr/bin/awk '{print $1}'

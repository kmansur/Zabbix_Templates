        - uuid: 366877a7af1b40e088638ef6645852ad
          name: 'Checksum of $1'
          key: 'vfs.file.cksum[/usr/local/etc/courier-imap/imapd-ssl]'
          delay: '3600'
          history: 7d
          tags:

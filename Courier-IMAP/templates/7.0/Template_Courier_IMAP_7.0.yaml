zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 7df96b18c230490a9a0a9e2307226338
      name: Templates
  templates:
    - uuid: ee81ff5fafe142d68dace3cbd3cb6569
      template: 'Template App MAIL Courier-IMAP'
      name: 'Template App MAIL Courier-IMAP'
      groups:
        - name: Templates
      items:
        - uuid: 40a836741f004b0eb016707f2f4833f6
          name: 'Imapd Connections per minute'
          key: imapd
          delay: '60'
          history: 7d
          value_type: FLOAT
          tags:
            - tag: Application
              value: connections
        - uuid: 161d6e88cc5b4d03a97bcb80654b108b
          name: 'Imapd-ssl Connections per minute'
          key: imapd-ssl
          delay: '60'
          history: 7d
          value_type: FLOAT
          tags:
            - tag: Application
              value: connections
        - uuid: 78391c88df0343dca7c635096b6d46b6
          name: 'maximum active connections.'
          type: ZABBIX_ACTIVE
          key: 'log[/var/log/maillog,"maximum active connections."]'
          delay: '300'
          history: 7d
          value_type: LOG
          trends: '0'
          tags:
            - tag: Application
              value: courier-imap
            - tag: Application
              value: mail
          triggers:
            - uuid: 835ef89fd64543aeb94985c0f2a70bdb
              expression: '((find(/Template App MAIL Courier-IMAP/log[/var/log/maillog,"maximum active connections."],,"regexp","maximum active connections."))<>0)'
              name: '{HOST.NAME} - maximum active connections'
              priority: WARNING
              description: 'Courier-IMAP reported that the maximum active connection limit was reached.'
              type: MULTIPLE
        - uuid: f057033aa5eb45cdad3e80311169c245
          name: 'Maximum connection limit reached for IP'
          type: ZABBIX_ACTIVE
          key: 'log[/var/log/maillog,"Maximum connection limit reached for"]'
          delay: '300'
          history: 7d
          value_type: LOG
          trends: '0'
          tags:
            - tag: Application
              value: courier-imap
            - tag: Application
              value: mail
          triggers:
            - uuid: 684f6e6466ab41c7bdc5ab9c3bb9449b
              expression: '((find(/Template App MAIL Courier-IMAP/log[/var/log/maillog,"Maximum connection limit reached for"],,"regexp","Maximum connection limit reached for"))<>0)'
              name: '{HOST.NAME} - Maximum connection limit reached for IP'
              priority: WARNING
              description: 'Courier-IMAP reported that the maximum connection limit was reached for a client IP.'
              type: MULTIPLE
        - uuid: bd445a54bb1843c494b0e60c500ae8ad
          name: 'Pop3d Connections per minute'
          key: pop3d
          delay: '60'

name: Align UniFi 7.0 template description

on:
  push:
    branches:
      - fix/unifi-7-description-0-7
    paths:
      - .github/workflows/fix-unifi-7-description.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unifi-7-description-0-7
          fetch-depth: 0
      - name: Update description
        run: |
          python3 -c "from pathlib import Path; p=Path('UniFi UDM Pro API Monitoring/7.0/UniFi_UDM_Pro_API_Monitoring_7.0.yaml'); s=p.read_text(); old='        local UniFi Network API.\\n'; new='        local UniFi Network API. Version 0.7.0 adds parallel collection from the\\n        documented Integration API statistics/latest endpoint for Network 10.6\\n        validation while retaining existing legacy telemetry for compatibility.\\n'; assert old in s; p.write_text(s.replace(old,new,1))"
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('UniFi UDM Pro API Monitoring/7.0/UniFi_UDM_Pro_API_Monitoring_7.0.yaml'))"
          grep -q 'Version 0.7.0 adds parallel collection' 'UniFi UDM Pro API Monitoring/7.0/UniFi_UDM_Pro_API_Monitoring_7.0.yaml'
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-unifi-7-description.yml
          git add 'UniFi UDM Pro API Monitoring/7.0/UniFi_UDM_Pro_API_Monitoring_7.0.yaml'
          git commit -m 'Align UniFi 7.0 template description'
          git push origin HEAD:fix/unifi-7-description-0-7

name: Apply UniFi Network 10.6 template update

on:
  push:
    branches:
      - feature/unifi-network-10-6
    paths:
      - .github/workflows/unifi-network-10-6-update.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: feature/unifi-network-10-6
          fetch-depth: 0

      - name: Apply transformation
        run: python3 tools/apply_unifi_network_10_6_update.py

      - name: Validate collector
        run: python3 -m py_compile 'UniFi UDM Pro API Monitoring/unifi_udm_pro_api.py'

      - name: Validate template YAML
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          root = Path('UniFi UDM Pro API Monitoring')
          for version in ('7.0', '8.0'):
              path = root / version / f'UniFi_UDM_Pro_API_Monitoring_{version}.yaml'
              text = path.read_text(encoding='utf-8')
              data = yaml.safe_load(text)
              assert data['zabbix_export']['version'] == version
              assert 'version: 0.7-0' in text
              assert 'UniFi official gateway statistics discovery' in text
              assert "macro: '{$UNIFI.TLS.ARG}'" in text
              assert 'device-stats' in text
              assert 'UniFi Network > Integrations' in text
          PY
          git diff --check

      - name: Commit validated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/unifi-network-10-6-update.yml tools/apply_unifi_network_10_6_update.py
          git add 'UniFi UDM Pro API Monitoring'
          git commit -m 'Add UniFi Network 10.6 official statistics support'
          git push origin HEAD:feature/unifi-network-10-6

name: Temporary Aligera template upload

on:
  push:
    paths:
      - '.github/workflows/tmp-upload-aligera-template.yml'

permissions:
  contents: write

jobs:
  upload-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore and commit Zabbix template
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Aligera/7.0
          cat > /tmp/template.b64 <<'PAYLOAD'
          
          
          
          
          
          PAYLOAD
          tr -d '[:space:]' < /tmp/template.b64 | base64 -d | bzip2 -dc > Aligera/7.0/template_aligera_ag561_e1_snmp.yaml
          echo 'bff6975c4f23f19eb20aea7df8f36a336f520966a423988eb6c3e825597f3445  Aligera/7.0/template_aligera_ag561_e1_snmp.yaml' | sha256sum -c -
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f --ignore-unmatch Aligera/7.0/.gitkeep
          git add Aligera/7.0/template_aligera_ag561_e1_snmp.yaml
          git commit -m 'feat: add Aligera AG561 Zabbix 7.0 template'
          git push

name: Fix UniFi README curl formatting

on:
  push:
    branches:
      - fix/unifi-readme-curl-format
    paths:
      - .github/workflows/fix-unifi-readme-curl-format.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unifi-readme-curl-format
          fetch-depth: 0
      - name: Format README examples
        run: |
          python3 tools/fix_unifi_readme_curl_format.py
          grep -q 'curl --fail-with-body -sS -k \\' 'UniFi UDM Pro API Monitoring/README.md'
          grep -q 'curl --fail-with-body -sS -k \\' 'UniFi UDM Pro API Monitoring/README.pt-BR.md'
          git diff --check
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-unifi-readme-curl-format.yml tools/fix_unifi_readme_curl_format.py
          git add 'UniFi UDM Pro API Monitoring/README.md' 'UniFi UDM Pro API Monitoring/README.pt-BR.md'
          git commit -m 'Fix UniFi API curl examples formatting'
          git push origin HEAD:fix/unifi-readme-curl-format

name: Validate Dovecot

on:
  push:
    paths:
      - 'Dovecot/**'
      - '.github/workflows/validate-dovecot.yml'
  pull_request:
    paths:
      - 'Dovecot/**'
      - '.github/workflows/validate-dovecot.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate POSIX shell syntax
        run: sh -n Dovecot/scripts/dovecot_stats.sh

      - name: Run collector regression tests
        run: sh Dovecot/tests/test_dovecot_stats.sh

      - name: Validate Zabbix templates
        run: python Dovecot/tests/validate_templates.py

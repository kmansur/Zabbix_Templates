        - uuid: 7213c806624246be970ca0c1087efeb9
          name: 'LLD - Network interfaces'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]'
          key: aligera.if.discovery
          delay: 1h
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFTYPE}'
                value: ^6$
                formulaid: A
          lifetime: 15d
          description: 'Discovers Ethernet interfaces through IF-MIB using ifType=ethernetCsmacd(6). On the validated AG561 this selects eth0/eth1 and semantically excludes loopback/tunnel interfaces without relying on fixed names.'
          item_prototypes:
            - uuid: fd3ed689763441c5ad4cde694f318492
              name: 'Interface {#IFDESCR}: Administrative status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
              key: 'aligera.ifAdminStatus[{#IFDESCR}]'
              history: 30d
              description: 'Interface administrative state according to IF-MIB.'
              valuemap:
                name: 'IF-MIB admin status'
              tags:
                - tag: component
                  value: network
                - tag: scope
                  value: availability
            - uuid: 84f27557d6264c59890966843a90e778
              name: 'Interface {#IFDESCR}: Alias'

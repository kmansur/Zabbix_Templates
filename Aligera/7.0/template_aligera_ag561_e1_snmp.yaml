          name: 'System: Object ID'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.2.0
          key: aligera.sysObjectID
          delay: 1h
          history: 7d
          value_type: CHAR
          trends: '0'
          description: 'SNMPv2-MIB::sysObjectID. Enterprise/model identifier reported by the SNMP agent.'
          tags:

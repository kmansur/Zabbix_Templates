        - uuid: fdbdd471e9864c96a4405ccf9e1c6a9e
          name: 'Device: System uptime'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: aligera.sysUpTime
          delay: 5m
          history: 7d
          value_type: FLOAT
          units: uptime
          description: 'Actual device uptime from SNMPv2-MIB::sysUpTime.0. This corrects the original template, which treated e1StatsTime as device uptime.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: f8bae526c3b94f75919834e7c7a07bb8
              expression: 'change(/Aligera AG561 E1 by SNMP/aligera.sysUpTime)<0 and not (last(/Aligera AG561 E1 by SNMP/aligera.sysUpTime,#2)>42000000 and last(/Aligera AG561 E1 by SNMP/aligera.sysUpTime)<1000000)'
              name: '{HOST.NAME}: AG561 reboot detected'
              priority: INFO
              description: 'sysUpTime decreased compared with the previous sample, indicating a probable reboot/restart. The expression ignores the normal TimeTicks wrap at approximately 497 days.'
              tags:
                - tag: component
                  value: system
                - tag: event
                  value: reboot
                - tag: scope
                  value: notice
        - uuid: 9b164a9cffd949da87c4445ca365bd5e

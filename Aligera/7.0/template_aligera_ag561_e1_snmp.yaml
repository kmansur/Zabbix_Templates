        - uuid: 9ecf2433890c4ee0bc50709cefb17ccd
          name: 'E1: Slips avg/hour since statistics reset'
          type: CALCULATED
          key: aligera.e1.summary.slips_per_hour
          delay: 5m
          history: 30d
          value_type: FLOAT
          units: events/h
          params: '3600*last(//aligera.e1.summary.slips)/max(last(//aligera.e1.summary.stats_time),1)'
          description: 'Average slips per hour since the last E1 statistics reset. Normalizes the accumulated counter by the statistics age.'
          tags:

      discovery_rules:
        - uuid: 2d5094fcfba4448e878e0c9b79123990
          name: 'LLD - Voice channels'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#CHANINDEX},1.3.6.1.4.1.41933.1.3.2.1.1,{#CHANTYPE},1.3.6.1.4.1.41933.1.3.2.1.2,{#CHANSTATUS},1.3.6.1.4.1.41933.1.3.2.1.3]'
          key: aligera.chan.discovery
          delay: 10m
          filter:
            evaltype: AND
            conditions:
              - macro: '{#CHANTYPE}'
                value: ^6$
                operator: NOT_MATCHES_REGEX
                formulaid: A
          lifetime: 1h
          description: 'Discovers AG561 voice channels. chanType=SIG(6) entries are excluded. Voice channels in N/A state remain discovered and may appear gray on the dashboard.'
          item_prototypes:
            - uuid: 6f2a847568814b1e88f5ed6288c7c9f2
              name: 'Channel {#CHANINDEX}'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.41933.1.3.2.1.3.{#SNMPINDEX}'
              key: 'aligera.chanStatus[{#CHANINDEX}]'
              history: 30d
              description: 'Channel state: 0=BLOCKED, 1=IDLE, 2=BUSY, 3=N/A.'
              valuemap:
                name: 'Aligera channel status'
              tags:
                - tag: component
                  value: channel
                - tag: role
                  value: voice
                - tag: scope
                  value: availability
              trigger_prototypes:
                - uuid: 4ec314697b9747b1bda6fa37ddb3c470
                  expression: 'max(/Aligera AG561 E1 by SNMP/aligera.chanStatus[{#CHANINDEX}],3m)=0'
                  name: '{HOST.NAME}: channel {#CHANINDEX} BLOCKED for 3 minutes'
                  priority: HIGH
                  description: 'The channel remained BLOCKED (0) for the last 3 minutes. Discovery keeps BLOCKED channels monitored.'
                  tags:
                    - tag: alarm
                      value: blocked
                    - tag: component
                      value: channel
                    - tag: scope
                      value: availability
            - uuid: d3e586c833ee463a9a280f766beadd71
              name: 'Channel {#CHANINDEX}: Type'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.41933.1.3.2.1.2.{#SNMPINDEX}'
              key: 'aligera.chanType[{#CHANINDEX}]'
              delay: 1h
              history: 7d
              description: 'Channel type according to ALIGERA-MIB.'
              valuemap:
                name: 'Aligera channel type'
              tags:
                - tag: component
                  value: channel
                - tag: role
                  value: voice
        - uuid: 2daeaa642d9948adad886b27e63749f0
          name: 'LLD - E1 interfaces and counters'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#E1INDEX},1.3.6.1.4.1.41933.1.2.2.1.1]'
          key: aligera.e1.discovery
          delay: 1h
          description: 'Discovers E1 interfaces and collects state, raw counters and derived rates for graphs and quality alerts.'
          item_prototypes:
            - uuid: 82e9a508076a483bb863305232b81657
              name: 'E1 {#E1INDEX}: AIS events rate'
              type: DEPENDENT
              key: 'aligera.e1AISEvents.rate[{#E1INDEX}]'
              delay: '0'
              history: 30d
              value_type: FLOAT
              units: eps
              description: 'Derived AIS events rate per second, used to show when errors/events actually occurred.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                  parameters:
                    - ''
              master_item:
                key: 'aligera.e1AISEvents[{#E1INDEX}]'
              tags:
                - tag: component
                  value: e1
                - tag: metric
                  value: ais_events
                - tag: scope
                  value: quality
            - uuid: f12514bebed74eb790ef4d8056793f22
              name: 'E1 {#E1INDEX}: AIS events'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.41933.1.2.2.1.9.{#SNMPINDEX}'
              key: 'aligera.e1AISEvents[{#E1INDEX}]'
              history: 30d
              description: 'Accumulated AIS events counter since the last E1 statistics reset.'
              tags:
                - tag: component
                  value: e1
                - tag: metric
                  value: ais_events
            - uuid: 28ac78f3333d47f0951c9e4a3d403cb6
              name: 'E1 {#E1INDEX}: AIS accumulated time'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.41933.1.2.2.1.10.{#SNMPINDEX}'
              key: 'aligera.e1AISTime[{#E1INDEX}]'
              history: 30d
              value_type: FLOAT
              units: s
              description: 'Accumulated time in AIS since the last E1 statistics reset, converted from hundredths of a second to seconds.'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '0.01'
              tags:
                - tag: component
                  value: e1
                - tag: metric
                  value: ais-time
                - tag: scope
                  value: quality
            - uuid: 5db9d22556134353b37ed6fa4562dcf0
              name: 'E1 {#E1INDEX}: Alarm status'
              type: SNMP_AGENT

        - uuid: ceb4f28d66e74bd384c237d781a6be37
          name: 'E1: Slips total'
          type: CALCULATED
          key: aligera.e1.summary.slips
          history: 30d
          params: 'sum(last_foreach(//aligera.e1Slips[*]))'

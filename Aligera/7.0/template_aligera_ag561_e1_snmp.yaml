              expression: 'avg(/Aligera AG561 E1 by SNMP/icmppingsec,5m)>{$ICMP.RESPONSE.WARN}'
              name: '{HOST.NAME}: ICMP latency above {$ICMP.RESPONSE.WARN} ms'
              priority: WARNING
              description: 'Average ICMP latency over the last 5 minutes exceeded the configured threshold.'
              dependencies:
                - name: '{HOST.NAME}: no ICMP response for 3 minutes'

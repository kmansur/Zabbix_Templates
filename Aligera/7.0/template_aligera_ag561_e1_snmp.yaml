zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 4fe4c01186624615a8f500eedf358ed5
      template: 'Aligera AG561 E1 by SNMP'
      name: 'Aligera AG561 E1 by SNMP'
      description: |
        Template for monitoring Aligera AG561 E1 gateways by SNMP in Zabbix 7.0.
        
        ORIGINAL TEMPLATE CREDITS
        Original author: Douglas Boldrini
        Original template: TEMPLATE_TELEFONIA_AG562_E1_LLD_SNMP_ZBX-5.0
        Firmware referenced by the original template: AG562 5.46
        Original source: https://github.com/boldrinidouglas/ZBX-GRA-ALIGERA
        Original file: TEMPLATE_TELEFONIA_AG562_E1_LLD_SNMP_ZBX-5.0.xml
        
        TECHNICAL BASIS
        The AG561 adaptation was built from the ALIGERA-MIB exposed by real AG561 devices (enterprise 1.3.6.1.4.1.41933) and validated with live SNMP walks. Standard SNMPv2-MIB and IF-MIB objects are also used where the device exposes reliable data.
        
        CURRENT FUNCTIONAL COVERAGE
        - Device identity, firmware description, uptime, SNMP availability, ICMP availability/loss/latency.
        - E1 current alarm state, statistics age, CRC, slips, code violations, LOS/AIS/BFAE/MFAE/RAI event counters and accumulated alarm duration.
        - Recent and normalized E1 quality metrics, statistics-reset detection and TimeTicks wrap protection.
        - Voice-channel LLD with SIG/TS16 exclusion, channel state, utilization, capacity, N/A detection and peak usage.
        - SIP peer LLD with name, host, port, keepalive and registry state. DisplayString states are recorded without assuming undocumented UP/DOWN semantics.
        - Ethernet-only IF-MIB LLD using ifType=6, 64-bit traffic counters, administrative/operational status, errors, discards, MTU and MAC address.
        - Template dashboards: Operational view, Diagnostics, SIP and Capacity.
        - SNMP traps for e1AlarmsChange, chanStatusChange and sipKeepaliveChange plus an unmatched fallback item.
        
        SNMP TRAP DESIGN
        Trap events are supplemental and short-lived. Polling-based triggers remain authoritative for persistent fault state and severity. This avoids duplicate long-lived problems while still recording near-real-time notifications from the gateway. Trap reception requires Zabbix server/proxy SNMP trapper configuration and the AG561 must be configured to send traps to that receiver.
        
        SIP NOTE
        The MIB defines sipKeepalive and sipRegistry as DisplayString without documented enumerations. On validated AG561 devices, Keepalive='Unmonitored' and Registry='-' are normal. The template therefore records state changes as INFO events but does not classify these strings as failures.
        
        VERSION HISTORY SUMMARY
        2.x: AG561 adaptation, Zabbix 7 schema fixes, E1/channel/SIP/IF-MIB expansion, dashboards, capacity/quality metrics, Counter64 traffic, robust LLD and production validation.
        3.0.0: Added SNMP trap collection and translated all user-facing template text to English.
      vendor:
        name: 'Net Tech'
        version: 3.0.0
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 1c2cf886099743bfbb6bbc8da74280e8
          name: 'Channels: BLOCKED'
          type: CALCULATED
          key: aligera.channels.blocked
          history: 30d
          params: 'count(last_foreach(//aligera.chanStatus[*]),"eq",0)'
          description: 'Number of channels whose latest state is BLOCKED (0).'
          tags:
            - tag: component
              value: channel
            - tag: scope
              value: performance
        - uuid: 67e9c3f5e44d49338c08a2c66d8c04fb
          name: 'Channels: Blocked percentage'
          type: CALCULATED
          key: aligera.channels.blocked_pct
          history: 30d
          value_type: FLOAT
          units: '%'
          params: '100*last(//aligera.channels.blocked)/max(last(//aligera.channels.total),1)'
          description: 'Current percentage of BLOCKED voice channels.'
          tags:
            - tag: component
              value: channel
            - tag: metric
              value: blocked
            - tag: scope
              value: capacity
        - uuid: 05bc997e4f0047b2848d6cfce48ca29c
          name: 'Channels: BUSY'
          type: CALCULATED
          key: aligera.channels.busy
          history: 30d
          params: 'count(last_foreach(//aligera.chanStatus[*]),"eq",2)'
          description: 'Number of channels whose latest state is BUSY (2).'
          tags:
            - tag: component
              value: channel
            - tag: scope
              value: performance
        - uuid: 52e34e8cdd114218a24e72e3ddb16cc0
          name: 'Channels: Peak BUSY - 24h'
          type: CALCULATED
          key: aligera.channels.busy.peak24h
          delay: 5m
          history: 30d
          params: 'max(//aligera.channels.busy,24h)'
          description: 'Highest number of BUSY channels observed during the last 24 hours.'
          tags:
            - tag: component
              value: channel
            - tag: metric
              value: peak
            - tag: scope
              value: capacity
        - uuid: 335c1b4975cd4d6f85029bd6cb2276a2
          name: 'Channels: Free percentage'
          type: CALCULATED
          key: aligera.channels.free_pct
          history: 30d
          value_type: FLOAT
          units: '%'
          params: '100*last(//aligera.channels.idle)/max(last(//aligera.channels.total),1)'
          description: 'Current percentage of free voice channels (IDLE).'
          tags:
            - tag: component
              value: channel
            - tag: metric
              value: free
            - tag: scope
              value: capacity
        - uuid: 3abcca0e77a342b691043a08a2ea62f7
          name: 'Channels: Free (IDLE)'
          type: CALCULATED
          key: aligera.channels.idle
          history: 30d
          params: 'count(last_foreach(//aligera.chanStatus[*]),"eq",1)'
          description: 'Current number of free voice channels (IDLE state).'
          tags:
            - tag: component
              value: channel
            - tag: scope
              value: performance
        - uuid: 78e4418a38944e24aa237bd1289bad18
          name: 'Channels: N/A'
          type: CALCULATED
          key: aligera.channels.na
          history: 30d
          params: 'count(last_foreach(//aligera.chanStatus[*]),"eq",3)'
          description: 'Current number of voice channels in N/A state.'
          tags:
            - tag: component
              value: channel
            - tag: scope
              value: performance
          triggers:
            - uuid: 201531606d0144f7bd58b3aab5a61ddc
              expression: 'min(/Aligera AG561 E1 by SNMP/aligera.channels.na,5m)>={$AG561.CHANNEL.NA.WARN}'
              name: '{HOST.NAME}: voice channel(s) in N/A state for 5 minutes'
              priority: WARNING
              description: 'One or more voice channels remained in N/A state for 5 minutes. The SIG/TS16 entry is excluded by LLD and does not participate in this alert.'
              tags:
                - tag: alarm
                  value: na
                - tag: component
                  value: channel
                - tag: scope
                  value: availability
        - uuid: efae17d1bc1c4870ad088fe9d59da868
          name: 'Channels: N/A percentage'
          type: CALCULATED
          key: aligera.channels.na_pct
          history: 30d
          value_type: FLOAT
          units: '%'
          params: '100*last(//aligera.channels.na)/max(last(//aligera.channels.total),1)'
          description: 'Current percentage of voice channels in N/A state.'
          tags:
            - tag: component
              value: channel
            - tag: metric
              value: na
            - tag: scope
              value: capacity
        - uuid: c40e16b9a889489ba11e1ef405e843ef
          name: 'Channels: Signaling entries'
          type: CALCULATED
          key: aligera.channels.signaling
          history: 7d
          params: last(//aligera.chanNumber)-last(//aligera.channels.total)
          description: 'Number of non-voice entries in the channel table, calculated as chanNumber minus monitored voice channels. On the validated AG561: 31 - 30 = 1 (SIG/TS16).'
          tags:
            - tag: component
              value: channel
            - tag: scope
              value: summary
        - uuid: ef8de2ddca3b48beabf15c52826c0302
          name: 'Channels: Voice channels monitored'
          type: CALCULATED
          key: aligera.channels.total
          history: 30d
          params: 'count(last_foreach(//aligera.chanType[*]),"ne",6)'
          description: 'Number of monitored voice channels, excluding SIG entries (chanType=6).'
          tags:
            - tag: component
              value: channel
            - tag: scope
              value: performance
        - uuid: adbc81e9ee434ea1b1213bb7146dada4
          name: 'Channels: Utilization'
          type: CALCULATED
          key: aligera.channels.utilization
          history: 30d
          value_type: FLOAT
          units: '%'
          params: '100*last(//aligera.channels.busy)/max(last(//aligera.channels.total),1)'
          description: 'Current percentage of BUSY voice channels over the total monitored voice channels.'
          tags:
            - tag: component
              value: channel
            - tag: metric
              value: utilization
            - tag: scope
              value: capacity
          triggers:
            - uuid: 5b197abf6a364725841cf276310e0540
              expression: 'avg(/Aligera AG561 E1 by SNMP/aligera.channels.utilization,5m)>{$AG561.CHANNEL.UTIL.HIGH}'
              name: '{HOST.NAME}: channel utilization above {$AG561.CHANNEL.UTIL.HIGH}%'
              priority: HIGH
              description: 'Average voice-channel utilization exceeded the High threshold for 5 minutes.'
              tags:
                - tag: component
                  value: channel
                - tag: scope
                  value: capacity
                - tag: severity
                  value: high-utilization
            - uuid: 0cb376df73af455f8dfe40258d127e49
              expression: 'avg(/Aligera AG561 E1 by SNMP/aligera.channels.utilization,5m)>{$AG561.CHANNEL.UTIL.WARN}'
              name: '{HOST.NAME}: channel utilization above {$AG561.CHANNEL.UTIL.WARN}%'
              priority: WARNING
              description: 'Average voice-channel utilization exceeded the Warning threshold for 5 minutes.'
              dependencies:
                - name: '{HOST.NAME}: channel utilization above {$AG561.CHANNEL.UTIL.HIGH}%'
                  expression: 'avg(/Aligera AG561 E1 by SNMP/aligera.channels.utilization,5m)>{$AG561.CHANNEL.UTIL.HIGH}'
              tags:
                - tag: component
                  value: channel
                - tag: scope
                  value: capacity
                - tag: severity
                  value: warning-utilization
        - uuid: 6556bec24db74c36ad2a45b065a3bf62
          name: 'Channels: Peak utilization - 24h'
          type: CALCULATED
          key: aligera.channels.utilization.peak24h
          delay: 5m
          history: 30d
          value_type: FLOAT
          units: '%'
          params: 'max(//aligera.channels.utilization,24h)'
          description: 'Highest channel-utilization percentage observed during the last 24 hours.'
          tags:
            - tag: component
              value: channel
            - tag: metric
              value: peak-utilization
            - tag: scope
              value: capacity
        - uuid: adf19aa58c064ae8855be56adad0ee0c
          name: 'Channels: Table entries'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.41933.1.3.1.0
          key: aligera.chanNumber
          delay: 5m
          history: 7d
          description: 'Number of channel-table entries reported by the firmware. Although the MIB describes this as ''number of voice channels'', the validated AG561 returns 31: 30 MFCR2 + 1 SIG (timeslot 16).'
          tags:
            - tag: component
              value: channel
            - tag: scope
              value: inventory
        - uuid: c89a9e847282429f9bea029a4a62c5c3
          name: 'Configuration: Mismatch count'
          type: CALCULATED
          key: aligera.config.mismatch_count
          history: 30d
          params: 'abs(signum(last(//aligera.e1Number)-{$AG561.E1.EXPECTED}))+abs(signum(last(//aligera.channels.total)-{$AG561.VOICE.EXPECTED}))+abs(signum(last(//aligera.channels.signaling)-{$AG561.SIG.EXPECTED}))+abs(signum(last(//aligera.sipNumber)-{$AG561.SIP.EXPECTED}))'
          description: 'Number of mismatches between observed values and expected macros for E1, voice channels, signaling and SIP peers. 0 = consistent.'
          tags:
            - tag: component
              value: system
            - tag: scope
              value: configuration
          triggers:
            - uuid: d7be0e4a10204c9fb59bb9e6a01c93d0
              expression: 'min(/Aligera AG561 E1 by SNMP/aligera.config.mismatch_count,10m)>0'
              name: '{HOST.NAME}: AG561 configuration/capacity differs from expected'
              priority: WARNING
              description: 'One or more observed capacities differ from the expected macros {$AG561.E1.EXPECTED}, {$AG561.VOICE.EXPECTED}, {$AG561.SIG.EXPECTED} or {$AG561.SIP.EXPECTED}.'
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: configuration
        - uuid: 6284a8a6ea434d799a597b9440fccc44
          name: 'Device: Product name'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.41933.1.1.1.0
          key: aligera.deviceName
          delay: 1h
          history: 7d
          value_type: CHAR
          trends: '0'
          description: 'Product name returned by ALIGERA-MIB::deviceName. A numeric OID is used so the Zabbix server/proxy does not depend on locally installed MIB files.'
          tags:
            - tag: component
              value: system
        - uuid: 99144c8ec57c4da09f8e20a2e976757b
          name: 'E1: AIS events total'
          type: CALCULATED
          key: aligera.e1.summary.ais
          history: 30d
          params: 'sum(last_foreach(//aligera.e1AISEvents[*]))'
          description: 'Sum of AIS events across discovered E1 interfaces.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: ais
            - tag: scope
              value: summary
        - uuid: 928f1f581ee840fd87d27621dc3c347c
          name: 'E1: AIS accumulated time'
          type: CALCULATED
          key: aligera.e1.summary.ais_time
          history: 30d
          value_type: FLOAT
          units: uptime
          params: 'sum(last_foreach(//aligera.e1AISTime[*]))'
          description: 'Total accumulated time in AIS since the last E1 statistics reset.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: ais-time
            - tag: scope
              value: quality
        - uuid: 2e73b7ca1baa4bf08a05d2bfd775699f
          name: 'E1: AIS time percentage'
          type: CALCULATED
          key: aligera.e1.summary.ais_time_pct
          history: 30d
          value_type: FLOAT
          units: '%'
          params: '100*last(//aligera.e1.summary.ais_time)/max(last(//aligera.e1.summary.stats_time),1)'
          description: 'Percentage of E1 statistics time accumulated in AIS state.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: ais-time-pct
            - tag: scope
              value: quality
        - uuid: 434bc81c16db482ea9e8dc6d232026f5
          name: 'E1: Alarm status'
          type: CALCULATED
          key: aligera.e1.summary.alarm
          history: 30d
          params: 'max(last_foreach(//aligera.e1Alarms[*]))'
          description: 'E1 state summary for the dashboard. On an AG561 with one E1 interface it mirrors the discovered E1 state; with multiple interfaces it returns the highest numeric alarm code.'
          valuemap:
            name: 'Aligera E1 alarm status'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: alarm
            - tag: scope
              value: summary
        - uuid: 5455b9702a304bff957d61627c615620
          name: 'E1: Total alarm time percentage'
          type: CALCULATED
          key: aligera.e1.summary.alarm_time_pct
          history: 30d
          value_type: FLOAT
          units: '%'
          params: 'min(100,max(0,last(//aligera.e1.summary.los_time_pct)+last(//aligera.e1.summary.ais_time_pct)+last(//aligera.e1.summary.bfae_time_pct)+last(//aligera.e1.summary.mfae_time_pct)+last(//aligera.e1.summary.rai_time_pct)))'
          description: 'Operational indicator of the accumulated statistics period spent in LOS/AIS/BFAE/MFAE/RAI states. Clamped to 0..100%. It must not be treated as a contractual SLA without additional firmware-behavior validation.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: alarm-time-pct
            - tag: scope
              value: quality
        - uuid: b8b8c151b673445eac83532cca7ad9fb
          name: 'E1: BFAE events total'
          type: CALCULATED
          key: aligera.e1.summary.bfae
          history: 30d
          params: 'sum(last_foreach(//aligera.e1BFAEEvents[*]))'
          description: 'Sum of BFAE events across discovered E1 interfaces.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: bfae
            - tag: scope
              value: summary
        - uuid: 9127fd2f53e041f2bb9ea5bdbebfc174
          name: 'E1: BFAE accumulated time'
          type: CALCULATED
          key: aligera.e1.summary.bfae_time
          history: 30d
          value_type: FLOAT
          units: uptime
          params: 'sum(last_foreach(//aligera.e1BFAETime[*]))'
          description: 'Total accumulated time in BFAE since the last E1 statistics reset.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: bfae-time
            - tag: scope
              value: quality
        - uuid: d778838c07fc4ff29e7866688eaf7804
          name: 'E1: BFAE time percentage'
          type: CALCULATED
          key: aligera.e1.summary.bfae_time_pct
          history: 30d
          value_type: FLOAT
          units: '%'
          params: '100*last(//aligera.e1.summary.bfae_time)/max(last(//aligera.e1.summary.stats_time),1)'
          description: 'Percentage of E1 statistics time accumulated in BFAE state.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: bfae-time-pct
            - tag: scope
              value: quality
        - uuid: 62ac9dcf1e1f40ddb567260aaf2cbd15
          name: 'E1: Code violations total'
          type: CALCULATED
          key: aligera.e1.summary.code
          history: 30d
          params: 'sum(last_foreach(//aligera.e1CodeViolations[*]))'
          description: 'Sum of code-violation counters across discovered E1 interfaces, used by the operational dashboard.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: code-violations
            - tag: scope
              value: summary
        - uuid: c0d69fe85f4445a4904f8ac7b1a85c70
          name: 'E1: Code violations avg/hour since statistics reset'
          type: CALCULATED
          key: aligera.e1.summary.code_per_hour
          delay: 5m
          history: 30d
          value_type: FLOAT
          units: events/h
          params: '3600*last(//aligera.e1.summary.code)/max(last(//aligera.e1.summary.stats_time),1)'
          description: 'Average code violations per hour since the last E1 statistics reset. Normalizes the accumulated counter by the statistics age.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: code-per-hour
            - tag: scope
              value: quality
        - uuid: 12783222babd42279f3ce626bf8ae3d4
          name: 'E1: Code violations recent equivalent/hour - 1h'
          type: CALCULATED
          key: aligera.e1.summary.code_recent_1h
          delay: 5m
          history: 30d
          value_type: FLOAT
          units: events/h
          params: '3600*sum(avg_foreach(//aligera.e1CodeViolations.rate[*],1h))'
          description: 'Equivalent code violations per-hour rate based only on the last hour of rate-item history. It is more appropriate for recent quality than the accumulated average since the statistics reset.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: code-recent-1h
            - tag: scope
              value: quality
        - uuid: 720171f04ca34f7ca6c6d8ab1deafc5d
          name: 'E1: CRC errors total'
          type: CALCULATED
          key: aligera.e1.summary.crc
          history: 30d
          params: 'sum(last_foreach(//aligera.e1CRCErrors[*]))'
          description: 'Sum of CRC error counters across discovered E1 interfaces, used by the operational dashboard.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: crc
            - tag: scope
              value: summary
        - uuid: 2b308651e5ab463886835e8e5f795bf4
          name: 'E1: CRC errors avg/hour since statistics reset'
          type: CALCULATED
          key: aligera.e1.summary.crc_per_hour
          delay: 5m
          history: 30d
          value_type: FLOAT
          units: events/h
          params: '3600*last(//aligera.e1.summary.crc)/max(last(//aligera.e1.summary.stats_time),1)'
          description: 'Average crc errors per hour since the last E1 statistics reset. Normalizes the accumulated counter by the statistics age.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: crc-per-hour
            - tag: scope
              value: quality
        - uuid: 3c9f83c0017e4fbcaab87bc810d4583b
          name: 'E1: CRC recent equivalent/hour - 1h'
          type: CALCULATED
          key: aligera.e1.summary.crc_recent_1h
          delay: 5m
          history: 30d
          value_type: FLOAT
          units: events/h
          params: '3600*sum(avg_foreach(//aligera.e1CRCErrors.rate[*],1h))'
          description: 'Equivalent crc per-hour rate based only on the last hour of rate-item history. It is more appropriate for recent quality than the accumulated average since the statistics reset.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: crc-recent-1h
            - tag: scope
              value: quality
        - uuid: 23759e9543534894868ab4b12cbd8830
          name: 'E1: Healthy time percentage (operational)'
          type: CALCULATED
          key: aligera.e1.summary.healthy_time_pct
          history: 30d
          value_type: FLOAT
          units: '%'
          params: 'max(0,min(100,100-last(//aligera.e1.summary.alarm_time_pct)))'
          description: 'Estimated operational healthy-time indicator: 100% minus the aggregated alarm-time percentage. Clamped to 0..100%. This is not a contractual SLA.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: healthy-time-pct
            - tag: scope
              value: quality
        - uuid: 6b22e796588e40dbb3c6cd1eb32d38da
          name: 'E1: LOS events total'
          type: CALCULATED
          key: aligera.e1.summary.los
          history: 30d
          params: 'sum(last_foreach(//aligera.e1LOSEvents[*]))'
          description: 'Sum of LOS events across discovered E1 interfaces.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: los
            - tag: scope
              value: summary
        - uuid: ee48c4ed86c44990a706c99b0b4cec90
          name: 'E1: LOS accumulated time'
          type: CALCULATED
          key: aligera.e1.summary.los_time
          history: 30d
          value_type: FLOAT
          units: uptime
          params: 'sum(last_foreach(//aligera.e1LOSTime[*]))'
          description: 'Total accumulated time in LOS since the last E1 statistics reset.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: los-time
            - tag: scope
              value: quality
        - uuid: 23419380aba644aea22e8e0df52f7913
          name: 'E1: LOS time percentage'
          type: CALCULATED
          key: aligera.e1.summary.los_time_pct
          history: 30d
          value_type: FLOAT
          units: '%'
          params: '100*last(//aligera.e1.summary.los_time)/max(last(//aligera.e1.summary.stats_time),1)'
          description: 'Percentage of E1 statistics time accumulated in LOS state.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: los-time-pct
            - tag: scope
              value: quality
        - uuid: 5cf80434026f4cecb4974f29182123ec
          name: 'E1: MFAE events total'
          type: CALCULATED
          key: aligera.e1.summary.mfae
          history: 30d
          params: 'sum(last_foreach(//aligera.e1MFAEEvents[*]))'
          description: 'Sum of MFAE events across discovered E1 interfaces.'
          tags:
            - tag: component
              value: e1
            - tag: metric
              value: mfae
            - tag: scope
              value: summary
        - uuid: 51dfba45a0144772b1fbd73d2d5c2b75
          name: 'E1: MFAE accumulated time'
          type: CALCULATED
